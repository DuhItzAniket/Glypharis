name: CI

on:
  push:
    branches: [main, "phase/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TORCH_VERSION: "2.14.1"
  TORCHVISION_VERSION: "0.29.1"

jobs:
  test:
    name: lint, types, tests (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/lock.txt

      - name: Install CPU-only PyTorch (same version as the laptop's CUDA build)
        run: |
          python -m pip install --upgrade pip
          pip install "torch==${TORCH_VERSION}" "torchvision==${TORCHVISION_VERSION}" \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Install locked dependencies and the package
        run: |
          pip install -r requirements/lock.txt
          pip install -e . --no-deps

      - name: Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Mypy
        run: mypy

      - name: Pytest
        run: pytest

      - name: Validate configs
        run: python scripts/validate_configs.py

      - name: Installed command (fresh environment)
        run: |
          glypharis-ocr --help
          python -c "import glypharis, glypharis.pipeline; print(glypharis.__version__)"

      - name: Environment report
        run: python scripts/env_report.py --out ci-env-report

      - name: Upload environment report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: env-report-ci
          path: ci-env-report/
          if-no-files-found: ignore
