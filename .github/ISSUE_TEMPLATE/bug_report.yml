name: Bug report
description: Something in the package, the commands or the server does not work as documented.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Security problems go through a private report instead
        (see SECURITY.md), not through a public issue.

        Text that is read wrongly on a hard page is not always a bug: the model card lists the
        known limitations and failure modes. A report is still welcome when the output differs
        from what the model card leads you to expect.
  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: |
        Paste the output of
        `python -c "import glypharis, json; print(json.dumps(glypharis.version_info(), indent=2))"`.
      render: json
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "e.g. Ubuntu 24.04, Windows 11, macOS 15"
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Backend
      description: The backend in use (`backend=` in Python, `--backend` on the command line).
      options:
        - torch (default)
        - onnx
        - both
        - not applicable (installation, download or server start-up)
    validations:
      required: true
  - type: dropdown
    id: entry-point
    attributes:
      label: Where it happens
      options:
        - Python API (GlypharisOCR, download_model)
        - glypharis-ocr
        - glypharis-serve
        - glypharis-check
        - Installation
        - Training, evaluation or other scripts in the repository
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model
      description: The model name or bundle path you loaded.
      placeholder: glypharis-v1
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest code or command that shows the problem.
      placeholder: |
        1. pip install glypharis==1.0.0
        2. glypharis-ocr --image page.png --output results
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What happened instead, with the full error message or traceback if there is one.
      render: text
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Sample image (optional)
      description: |
        Attach a sample image only if you are free to share it publicly. Do not attach pages
        that hold personal, confidential or copyrighted material; describe the page instead
        (kind of document, size in pixels, scan or photo).
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
        - label: This is not a security problem (those go through a private report, see SECURITY.md).
          required: true
