[build-system]
# 77 is the first setuptools with PEP 639 (an SPDX `license` and `license-files`); it also builds
# wheels without the separate `wheel` package.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "glypharis"
dynamic = ["version"]
description = "Lightweight OCR engine for document images: text-line detector + CTC line recognizer."
# The PyPI page: README's content with links pinned to the tag (README keeps relative links).
readme = "docs/PYPI.md"
# 3.11 is the only tested version; safe tar extraction needs 3.11.4 (PHASE_STATUS Phase 23, D13).
requires-python = ">=3.11.4,<3.12"
license = "Apache-2.0"
# Named one by one, so no weight notice can enter the code packages.
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "DuhItzAniket" }]
keywords = [
    "ocr",
    "text recognition",
    "text detection",
    "document images",
    "ctc",
    "dbnet",
    "pytorch",
    "onnx",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
# Core: what the inference import chain (glypharis, glypharis.pipeline, glypharis.export.bundle,
# glypharis.models, glypharis.cli, glypharis.server) and the ONNX backend need. Lower bounds are the
# major.minor of requirements/lock.txt; torch and torchvision follow the pins in CI and
# requirements/README.md, and their platform build is installed separately (CUDA on the laptop, CPU
# in CI). Exact versions stay in requirements/lock.txt.
dependencies = [
    "torch>=2.14",
    "torchvision>=0.29",
    "numpy>=2.4",
    "pyyaml>=6.0",
    "pillow>=12.3",
    "opencv-contrib-python-headless>=5.0",
    "rapidfuzz>=3.14",
    "shapely>=2.2",
    "scipy>=1.17",
    "onnxruntime>=1.31",
]

[project.optional-dependencies]
# Training, data preparation and reports: plots, fonts, PDF rendering, resource monitoring.
train = [
    "matplotlib>=3.11",
    "fonttools>=4.66",
    "pypdfium2>=5.14",
    "psutil>=7.2",
    "nvidia-ml-py>=13.615",
]
# Exporting and quantising ONNX files (reading them needs only onnxruntime).
export = ["onnx>=1.23"]
dev = [
    "pytest>=9.1",
    "ruff>=0.17",
    "mypy>=2.4",
    "types-PyYAML>=6.0",
    "types-psutil>=7.2",
]

[project.urls]
Homepage = "https://github.com/DuhItzAniket/Glypharis"
Source = "https://github.com/DuhItzAniket/Glypharis"
Issues = "https://github.com/DuhItzAniket/Glypharis/issues"
Changelog = "https://github.com/DuhItzAniket/Glypharis/blob/main/CHANGELOG.md"

[project.scripts]
glypharis-ocr = "glypharis.cli:main"
glypharis-serve = "glypharis.server:main"
glypharis-check = "glypharis.check:main"

[tool.setuptools.dynamic]
version = { attr = "glypharis.__version__" }

[tool.setuptools.packages.find]
include = ["glypharis*"]

[tool.setuptools.package-data]
# The sample page and its expected output that glypharis-check reads (Phase 23, item 9).
glypharis = ["sample/page.png", "sample/expected.json", "sample/README.md"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", ".venv-*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # allow typographic characters in strings/comments (OCR text)

[tool.mypy]
python_version = "3.11"
packages = ["glypharis"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["pynvml", "pynvml.*", "fontTools", "fontTools.*", "cv2", "cv2.*", "pypdfium2", "pypdfium2.*", "shapely", "shapely.*", "scipy", "scipy.*", "torchvision", "torchvision.*", "onnxruntime", "onnxruntime.*", "onnx", "onnx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# A test still running after this many seconds dumps every thread's stack (a hang shows where).
faulthandler_timeout = 120
markers = [
    "gpu: needs a CUDA device (skipped automatically when none is available)",
]
