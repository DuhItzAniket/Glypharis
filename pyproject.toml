[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "glypharis"
version = "0.1.0.dev0"
description = "Lightweight OCR engine for document images: text-line detector + CTC line recognizer."
readme = "README.md"
requires-python = ">=3.11,<3.12"
# Exact versions live in requirements/lock.txt. torch / torchvision are installed separately because
# the wheel differs per platform (CUDA build on the laptop, CPU build in CI); see requirements/README.md.
dependencies = [
    "torch",
    "torchvision",
    "numpy",
    "pyyaml",
    "psutil",
    "nvidia-ml-py",
    "pillow",
    "matplotlib",
    "fonttools",
    "pypdfium2",
    "opencv-contrib-python-headless",
    "rapidfuzz",
    "shapely",
    "scipy",
    "onnx",
    "onnxruntime",
]

[project.scripts]
glypharis-ocr = "glypharis.cli:main"

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy", "types-PyYAML", "types-psutil"]

[tool.setuptools.packages.find]
include = ["glypharis*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", ".venv-*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # allow typographic characters in strings/comments (OCR text)

[tool.mypy]
python_version = "3.11"
packages = ["glypharis"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["pynvml", "pynvml.*", "fontTools", "fontTools.*", "cv2", "cv2.*", "pypdfium2", "pypdfium2.*", "shapely", "shapely.*", "scipy", "scipy.*", "torchvision", "torchvision.*", "onnxruntime", "onnxruntime.*", "onnx", "onnx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# A test still running after this many seconds dumps every thread's stack (a hang shows where).
faulthandler_timeout = 120
markers = [
    "gpu: needs a CUDA device (skipped automatically when none is available)",
]
